<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="600" cy="220" r="100"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#06b6d4" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="300" cy="500" r="150" fill="#3b82f6" opacity="0.05"/>
  
  <!-- Profile Image Circle -->
  <circle cx="600" cy="220" r="105" fill="none" stroke="url(#accentGradient)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="600" cy="220" r="100" fill="#1e293b"/>
  <image href="/profile.jpg" x="500" y="120" width="200" height="200" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Name -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">Shashank Pandya</text>
  
  <!-- Title -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="28" fill="url(#accentGradient)" text-anchor="middle">Full-Stack Developer &amp; AI/ML Engineer</text>
  
  <!-- Location -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">IIT Kharagpur</text>
  
  <!-- Tech Badges -->
  <g transform="translate(240, 560)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#06b6d4" opacity="0.2"/>
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle">React • Python</text>
  </g>
  
  <g transform="translate(420, 560)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#8b5cf6" opacity="0.2"/>
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="14" fill="#8b5cf6" text-anchor="middle">TensorFlow • AWS</text>
  </g>
  
  <g transform="translate(600, 560)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#3b82f6" opacity="0.2"/>
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">AI/ML • LLMs</text>
  </g>
  
  <g transform="translate(780, 560)">
    <rect x="0" y="0" width="160" height="44" rx="22" fill="#22c55e" opacity="0.2"/>
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="14" fill="#22c55e" text-anchor="middle">Open to Work</text>
  </g>
</svg>
