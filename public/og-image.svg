<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Decorative Orbs -->
  <circle cx="200" cy="150" r="200" fill="#06b6d4" opacity="0.1"/>
  <circle cx="1000" cy="480" r="250" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="600" cy="315" r="300" fill="#3b82f6" opacity="0.05"/>
  
  <!-- Name -->
  <text x="600" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle">
    SHASHANK PANDYA
  </text>
  
  <!-- Title -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="url(#textGrad)" text-anchor="middle">
    Full-Stack Developer &amp; AI Engineer
  </text>
  
  <!-- Institution -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">
    Indian Institute of Technology Kharagpur
  </text>
  
  <!-- Tech Stack -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">
    React • Python • AWS Lambda • Generative AI • Machine Learning
  </text>
  
  <!-- Bottom Bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#06b6d4" opacity="0.2"/>
  <text x="600" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#06b6d4" text-anchor="middle">
    portfolio-shashankpandya.vercel.app
  </text>
</svg>