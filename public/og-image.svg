<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="600" cy="200" r="80"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="200" fill="#06b6d4" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#8b5cf6" opacity="0.1"/>
  
  <!-- GitHub Avatar with gradient border -->
  <circle cx="600" cy="200" r="85" fill="none" stroke="url(#accentGradient)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="80" fill="#1e293b"/>
  <image href="https://avatars.githubusercontent.com/u/146766254?v=4" x="520" y="120" width="160" height="160" clip-path="url(#avatarClip)"/>
  
  <!-- Name -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">Shashank Pandya</text>
  
  <!-- Title -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="28" fill="url(#accentGradient)" text-anchor="middle">Full-Stack Developer &amp; AI/ML Engineer</text>
  
  <!-- Location -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">IIT Kharagpur</text>
  
  <!-- Tech badges -->
  <g transform="translate(260, 520)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#06b6d4" opacity="0.2"/>
    <text x="80" y="26" font-family="Arial, sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle">React • Python</text>
  </g>
  
  <g transform="translate(440, 520)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#8b5cf6" opacity="0.2"/>
    <text x="80" y="26" font-family="Arial, sans-serif" font-size="14" fill="#8b5cf6" text-anchor="middle">TensorFlow • AWS</text>
  </g>
  
  <g transform="translate(620, 520)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#3b82f6" opacity="0.2"/>
    <text x="80" y="26" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">AI/ML • LLMs</text>
  </g>
  
  <g transform="translate(800, 520)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="#22c55e" opacity="0.2"/>
    <text x="70" y="26" font-family="Arial, sans-serif" font-size="14" fill="#22c55e" text-anchor="middle">Open to Work</text>
  </g>
</svg>
